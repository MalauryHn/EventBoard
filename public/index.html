<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBoard - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0f0c29',
                        aubergine: '#302b63',
                        purple: '#24243e',
                        accent: '#8b5cf6'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(to right, #0f0c29, #302b63, #24243e); }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item.active { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; border-right: 3px solid #8b5cf6; }
    </style>
</head>
<body class="text-gray-200 font-sans antialiased overflow-x-hidden">

    <div class="flex min-h-screen">
        
        <aside class="w-64 glass hidden md:flex flex-col z-20 sticky top-0 h-screen">
            <div class="p-6 flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center font-bold text-white">E</div>
                <h1 class="text-xl font-bold tracking-wider">EventBoard</h1>
            </div>

            <nav class="flex-1 px-4 space-y-2 mt-4">
                <a href="#" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-all group">
                    <i class="ph ph-squares-four text-xl"></i> <span>Explorer</span>
                </a>
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-all text-gray-400 group">
                    <i class="ph ph-ticket text-xl group-hover:text-purple-400 transition-colors"></i> <span>Mes Tickets</span>
                </a>
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-all text-gray-400 group">
                    <i class="ph ph-calendar-blank text-xl group-hover:text-purple-400 transition-colors"></i> <span>Calendrier</span>
                </a>
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-white/5 transition-all text-gray-400 group">
                    <i class="ph ph-users text-xl group-hover:text-purple-400 transition-colors"></i> <span>Communauté</span>
                </a>
            </nav>

            <div class="p-4 border-t border-white/5">
                <button class="flex items-center gap-3 text-gray-400 hover:text-red-400 transition-colors w-full px-4 py-2">
                    <i class="ph ph-sign-out text-xl"></i> <span>Déconnexion</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 relative">
            
            <header class="sticky top-0 z-30 glass border-b-0 px-8 py-4 flex justify-between items-center bg-[#0f0c29]/80">
                <div class="md:hidden text-xl font-bold">EventBoard</div>
                
                <div class="hidden md:flex items-center bg-black/20 rounded-full px-4 py-2 w-96 border border-white/5">
                    <i class="ph ph-magnifying-glass text-gray-400"></i>
                    <input type="text" placeholder="Rechercher un événement..." class="bg-transparent border-none focus:outline-none text-sm ml-2 w-full text-white placeholder-gray-500">
                </div>

                <div class="flex items-center gap-4">
                    <button class="relative p-2 text-gray-400 hover:text-white transition-colors">
                        <i class="ph ph-bell text-xl"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-pink-500 rounded-full animate-pulse"></span>
                    </button>
                    <div class="flex items-center gap-3 pl-4 border-l border-white/10 cursor-pointer group">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-bold text-white group-hover:text-purple-300 transition-colors">MalauryBastien Dev</p>
                            <p class="text-xs text-gray-500">Étudiant</p>
                        </div>
                        <img src="https://ui-avatars.com/api/?name=MalauryBastien+Dev&background=8b5cf6&color=fff" alt="Avatar" class="w-10 h-10 rounded-full border-2 border-purple-500/50 group-hover:border-purple-400 transition-all shadow-lg shadow-purple-500/20">
                    </div>
                </div>
            </header>

            <div class="p-8 pb-24 max-w-7xl mx-auto">
                <div class="mb-10 flex justify-between items-end" data-aos="fade-down">
                    <div>
                        <h2 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-purple-400 mb-2">Bienvenue, MalauryBastien 👋</h2>
                        <p class="text-gray-400">Découvrez ce qui se passe sur le campus cette semaine.</p>
                    </div>
                    <button onclick="document.getElementById('addEventModal').classList.remove('hidden')" 
                        class="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white px-6 py-3 rounded-xl font-medium shadow-lg shadow-purple-500/25 hover:shadow-purple-500/40 hover:-translate-y-1 transition-all flex items-center gap-2">
                        <i class="ph ph-plus-circle text-xl"></i> Nouvel Événement
                    </button>
                </div>

                <div id="events-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    </div>
            </div>
        </main>
    </div>

    <div id="addEventModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in">
        <div class="glass bg-[#1a1638] w-full max-w-lg rounded-2xl p-8 relative shadow-2xl border border-purple-500/30">
            <button onclick="document.getElementById('addEventModal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-white transition-colors">
                <i class="ph ph-x text-2xl"></i>
            </button>
            <h3 class="text-2xl font-bold mb-6 text-white">Publier un événement</h3>
            <form id="addEventForm" class="space-y-5">
                <div><label class="text-xs text-gray-400 uppercase tracking-wider font-bold">Titre</label><input type="text" name="title" required class="w-full mt-1 bg-black/30 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 focus:outline-none transition-colors"></div>
                <div><label class="text-xs text-gray-400 uppercase tracking-wider font-bold">Description</label><textarea name="description" rows="3" required class="w-full mt-1 bg-black/30 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 focus:outline-none transition-colors"></textarea></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-xs text-gray-400 uppercase tracking-wider font-bold">Date</label><input type="date" name="date" required class="w-full mt-1 bg-black/30 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 focus:outline-none transition-colors"></div>
                    <div><label class="text-xs text-gray-400 uppercase tracking-wider font-bold">Lieu</label><input type="text" name="location" required class="w-full mt-1 bg-black/30 border border-white/10 rounded-lg p-3 text-white focus:border-purple-500 focus:outline-none transition-colors"></div>
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-lg shadow-lg mt-4 transition-all">Valider</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="app.js"></script>
    </body>
</html>
